plugins {
    id("com.android.library")
}
apply from: "../../common.gradle"
apply from: "../../playFlavor.gradle"

android {
    namespace "de.danoeh.antennapod.feature.highlight"

    defaultConfig {
        consumerProguardFiles "consumer-rules.pro"
    }
}

dependencies {
    implementation project(':model')
    implementation project(':storage:database')
    implementation project(':storage:preferences')
    implementation project(':parser:transcript')
    implementation project(':playback:base')
    implementation project(':playback:service')
    implementation "androidx.media3:media3-session:$media3Version"
    implementation project(':ui:notifications')

    annotationProcessor "androidx.annotation:annotation:$annotationVersion"
    implementation "androidx.appcompat:appcompat:$appcompatVersion"
    implementation "androidx.fragment:fragment:$fragmentVersion"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.8.7"
    implementation "androidx.lifecycle:lifecycle-livedata:2.8.7"
    implementation "androidx.work:work-runtime:$workManagerVersion"
    implementation "com.squareup.okhttp3:okhttp:$okhttpVersion"
    implementation "io.reactivex.rxjava3:rxandroid:$rxAndroidVersion"
    implementation "io.reactivex.rxjava3:rxjava:$rxJavaVersion"
    implementation "com.google.android.material:material:$googleMaterialVersion"
    implementation "com.google.guava:guava:31.0.1-android"
    implementation "com.github.bumptech.glide:glide:$glideVersion"
    implementation project(':feature:sherpa-onnx')
}
